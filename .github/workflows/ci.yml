name: CI

# Lives at the repository root on purpose: GitHub Actions only reads
# .github/workflows/ from the root, so while this file sat in app/.github/ it
# never ran once. Every `run` step below is therefore explicit about which
# half of the repo it belongs to — `app/` is an npm project, the root is a
# dependency-free static hub.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hub:
    name: hub (static site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step: the hub has no package.json and no dependencies.
      - name: Hub behaviour checks
        run: node test-hub.mjs

      # Ошибка — спека непригодна для сборки (нет шапки, требует несуществующих
      # событий) или расписание в games.json ссылается на слаг, которого нет в
      # specs/. Недозаполненное печатается предупреждением и сборку не роняет.
      - name: Specs conform to the template
        run: node specs/validate.mjs

      # Пустая папка ideas/ — не ошибка: файл идеи заводится под концепт.
      - name: Ideas conform to the template
        run: node ideas/validate.mjs

      # Снимок доски закоммичен, чтобы страница была чистой статикой. Значит,
      # его можно забыть обновить — эта проверка не даёт. Сверяется только то,
      # что зависит от файлов: дата меняется сама, и страница её пересчитывает
      # в браузере. Проверка гоняется на каждом пуше и ничего не требует
      # включать руками.
      - name: Dashboard data matches the repository
        run: node pipeline.mjs --check

      # Страницы хаба генерируются из games.json и шапок спек, и их выход
      # закоммичен. Если источник поменяли, а генератор не перезапустили,
      # закоммиченное молча расходится с данными.
      #
      # distribution/build-posts.mjs сюда не входит: дистрибуция заморожена до
      # первой публикации, её выход не коммитится (distribution/README.md).
      - name: Generated files are in sync with their sources
        run: |
          node build-games.mjs
          if ! git diff --quiet; then
            echo "::error::Generated output differs from what is committed. Run 'node build-games.mjs' and commit the result."
            git diff --stat
            exit 1
          fi

  web:
    name: typecheck / lint / test / build / e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (includes the Shell/Mechanic boundaries)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      # `uses` steps are not affected by defaults.run.working-directory, so
      # artifact paths stay relative to the workspace root.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  # Manual only (workflow_dispatch), never on push: Capacitor/Android is out of
  # the default daily path (docs/decisions.md, 2026-09-16). Run this by hand
  # once a phase 2 winner needs an APK.
  #
  # OPEN GAP: webDir is 'dist', which the multi-page build fills with every
  # game under games/*/ — packaging "the winner" needs picking one game's
  # output out first. Not solved yet; solve it when there is an actual winner,
  # not speculatively now.
  android:
    name: assembleDebug
    runs-on: ubuntu-latest
    needs: web
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build web assets
        run: npm run build

      # android/ is not committed in the template (docs/decisions.md D-003).
      # In a game repo it is committed and this step is a no-op.
      - name: Ensure the native project exists
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build a debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
