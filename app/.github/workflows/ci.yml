name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: typecheck / lint / test / build / e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (includes the Shell/Mechanic boundaries)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Meaningless while this repo has no android/ committed at all — Capacitor
      # packaging is opt-in for a phase 2 winner only (docs/decisions.md,
      # 2026-09-16), never part of the daily push.
      - name: Template placeholders were replaced
        run: |
          echo "Placeholder-rewrite scripts were retired with the old single-game layout — see docs/decisions.md. Skipping."

  # Manual only (workflow_dispatch), never on push: Capacitor/Android is out of
  # the default daily path (docs/decisions.md, 2026-09-16). Run this by hand
  # once a phase 2 winner needs an APK.
  #
  # OPEN GAP: webDir is 'dist', which the multi-page build fills with every
  # game under games/*/ — packaging "the winner" needs picking one game's
  # output out first. Not solved yet; solve it when there is an actual winner,
  # not speculatively now.
  android:
    name: assembleDebug
    runs-on: ubuntu-latest
    needs: web
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build web assets
        run: npm run build

      # android/ is not committed in the template (docs/decisions.md D-003).
      # In a game repo it is committed and this step is a no-op.
      - name: Ensure the native project exists
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build a debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
