<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLAY — конвейер</title>
<meta name="description" content="Статус конвейера прототипов: стадии, воронка и то, что ждёт решения.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
/* Токены хаба (styles.css) плюс порядковая рампа для воронки.
   Рампа проверена валидатором dataviz в обеих модах: одна тональность,
   монотонная светлота, шаги ≥0.06, светлый конец держит 2:1 к поверхности. */
:root{
  color-scheme: light;
  --ink:#212121; --muted:#61615e; --faint:#8a8a86;
  --paper:#ededeb; --card:#f6f6f4; --line:#d6d6d2; --soft:#e5e5e2;
  --accent:#b8461f;
  --wait:#a8410a;          /* «ждёт тебя» — тот же тёплый тон, контраст 5.2:1 */
  --ok:#0ca30c;
  --s1:#ee9c6a; --s2:#ce8557; --s3:#ae6d44; --s4:#905732; --s5:#734121;
  --sans:Inter,"Helvetica Neue","Segoe UI",system-ui,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ink:#f2f2ef; --muted:#a8a8a2; --faint:#7b7b76;
    --paper:#141413; --card:#1f1f1d; --line:#33332f; --soft:#262623;
    --accent:#e8845f;
    --wait:#f0a173;
    --ok:#3fc23f;
    --s1:#863e00; --s2:#9f5a2b; --s3:#b7764c; --s4:#d0926c; --s5:#e9af8d;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ink:#f2f2ef; --muted:#a8a8a2; --faint:#7b7b76;
  --paper:#141413; --card:#1f1f1d; --line:#33332f; --soft:#262623;
  --accent:#e8845f; --wait:#f0a173; --ok:#3fc23f;
  --s1:#863e00; --s2:#9f5a2b; --s3:#b7764c; --s4:#d0926c; --s5:#e9af8d;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1040px; margin:0 auto; padding:32px 16px 64px}

header{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 16px; margin-bottom:28px}
h1{margin:0; font-size:20px; font-weight:700; letter-spacing:-.3px}
h1 span{color:var(--accent)}
.meta{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums}
.meta b{color:var(--ink); font-weight:600}

h2{
  margin:0 0 14px; font-size:12px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--faint);
}
section{margin-bottom:36px}

/* --- Ждёт тебя: единственная крупная цифра на странице ------------------ */
.hero{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:24px; display:flex; flex-wrap:wrap; gap:24px 40px; align-items:flex-start;
}
.hero-figure{min-width:132px}
.hero-num{font-size:56px; line-height:1; font-weight:600; letter-spacing:-2px; color:var(--wait)}
.hero-num.is-clear{color:var(--ok)}
.hero-label{margin-top:6px; font-size:13px; color:var(--muted)}
.hero-list{flex:1 1 320px; margin:0; padding:0; list-style:none; min-width:0}
.hero-list li{
  display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline;
  padding:9px 0; border-top:1px solid var(--line);
}
.hero-list li:first-child{border-top:0; padding-top:2px}
.hero-list .slug{font-family:var(--mono); font-size:13px; font-weight:600}
.hero-list .where{color:var(--faint); font-size:12px; font-variant-numeric:tabular-nums}
.hero-list .what{color:var(--wait); font-size:13px; font-weight:500}
.hero-list .what::before{content:"▸ "; }
.hero-empty{color:var(--muted); font-size:14px; align-self:center}

/* --- Плитки ------------------------------------------------------------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px}
.tile{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px}
.tile-val{font-size:28px; font-weight:600; line-height:1.1; letter-spacing:-.5px}
.tile-lab{margin-top:2px; font-size:12px; color:var(--muted)}

/* --- Воронка: горизонтальные полосы, порядковая рампа -------------------- */
.funnel{display:flex; flex-direction:column; gap:2px}
.fn-row{display:grid; grid-template-columns:104px 1fr; gap:12px; align-items:center}
.fn-name{font-size:13px; color:var(--muted); text-align:right}
.fn-track{position:relative; height:26px; background:var(--soft); border-radius:4px}
.fn-bar{height:100%; border-radius:4px; transition:width .3s ease}
.fn-val{
  position:absolute; top:0; height:26px; display:flex; align-items:center;
  font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink);
}
.fn-zero{color:var(--faint); font-weight:400}

/* --- Таблица ------------------------------------------------------------ */
table{width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed}
col.c1{width:56px} col.c2{width:26%} col.c3{width:140px} col.c4{width:96px} col.c5{width:auto}
caption{text-align:left; color:var(--faint); font-size:12px; padding-bottom:8px}
th{
  text-align:left; font-weight:600; font-size:11px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--faint); padding:0 10px 8px 0;
  border-bottom:1px solid var(--line); white-space:nowrap;
}
td{padding:8px 10px 8px 0; border-bottom:1px solid var(--line); vertical-align:top}
tr:last-child td{border-bottom:0}
.c-day{color:var(--faint); font-variant-numeric:tabular-nums; white-space:nowrap}
.c-slug{font-family:var(--mono); font-size:12.5px; overflow-wrap:break-word}
.c-note{color:var(--muted); font-variant-numeric:tabular-nums}
.c-wait{color:var(--wait); font-weight:500}
.chip{
  display:inline-flex; align-items:center; gap:6px;
  font-size:12px; white-space:nowrap;
}
.dot{width:8px; height:8px; border-radius:2px; flex:none}
.is-rejected .c-slug,.is-rejected .c-stage{opacity:.55}
.is-empty td{color:var(--faint)}

footer{margin-top:40px; color:var(--faint); font-size:12px; line-height:1.6}
footer code{font-family:var(--mono); font-size:11.5px; background:var(--soft); padding:1px 5px; border-radius:3px}
.err{background:var(--card); border:1px solid var(--line); border-left:3px solid var(--wait); border-radius:8px; padding:16px; font-size:14px}

@media (max-width:620px){
  .wrap{padding:24px 16px 48px}
  .hero{padding:18px}
  .hero-num{font-size:44px}
  .fn-row{grid-template-columns:88px 1fr; gap:8px}
  .fn-name{font-size:12px}
  /* Колонки «Цифры» и «Ждёт» уезжают: первая пуста почти всегда, вторая
     дословно повторяет блок «Ждёт тебя» вверху страницы. */
  /* В fixed-раскладке ширина колонки задаётся <col>, и display:none на
     ячейках её не убирает — поэтому обнуляем и сами колонки. */
  col.c1{width:40px} col.c2{width:auto} col.c3{width:110px}
  col.c4,col.c5{width:0}
  th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){display:none}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>PLAY<span>.</span> конвейер</h1>
  <div class="meta" id="when">загрузка…</div>
</header>

<main id="app">
  <p class="err" hidden id="error"></p>
</main>

<footer>
  Стадия нигде не хранится — она считается из того, какие файлы есть в
  репозитории. Обновляется командой <code>node pipeline.mjs --write</code> и
  выкатывается вместе с коммитом.
  <br><span id="stamp"></span>
</footer>

</div>

<script>
const STAGE_RANK = {
  'идея': 0, 'спека': 1, 'собрана': 2, 'принята': 2,
  'опубликована': 3, 'цифры': 3, 'вердикт': 4,
};
const RAMP = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'];

const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const stageColor = (stage) => {
  const rank = STAGE_RANK[stage];
  return rank === undefined ? 'var(--line)' : RAMP[Math.min(rank, RAMP.length - 1)];
};

function hero(data) {
  const list = data.waiting;
  const figure = `<div class="hero-figure">
    <div class="hero-num${list.length ? '' : ' is-clear'}">${list.length}</div>
    <div class="hero-label">${list.length ? 'ждёт твоего решения' : 'ничего не ждёт'}</div>
  </div>`;

  if (list.length === 0) {
    return `<section><h2>Ждёт тебя</h2><div class="hero">${figure}
      <p class="hero-empty">Все ворота пройдены. Следующий ход за конвейером.</p>
    </div></section>`;
  }

  const items = list.map((w) => `<li>
    <span class="slug">${esc(w.slug)}</span>
    <span class="where">${w.day === null ? '#' + esc(w.number ?? '—') : 'день ' + esc(w.day)}</span>
    <span class="what">${esc(w.waiting)}</span>
  </li>`).join('');

  return `<section><h2>Ждёт тебя</h2><div class="hero">${figure}
    <ul class="hero-list">${items}</ul>
  </div></section>`;
}

function tiles(data) {
  const c = data.counts;
  const t = data.trends ?? { count: 0, latest: null };
  const age = t.latest
    ? Math.round((Date.parse(data.today + 'T00:00:00Z') - Date.parse(t.latest + 'T00:00:00Z')) / 86400000)
    : null;
  const cells = [
    ['наблюдений' + (age === null ? '' : ` · ${age} дн. назад`), t.count],
    ['идей', c.ideas],
    ['спек', c.specs],
    ['собрано', c.built],
    ['опубликовано', c.published],
    ['с вердиктом', c.judged],
  ];
  if (c.rejected > 0) cells.push(['отклонено', c.rejected]);

  return `<section><h2>Всего</h2><div class="tiles">${cells.map(([lab, val]) =>
    `<div class="tile"><div class="tile-val">${val}</div><div class="tile-lab">${lab}</div></div>`
  ).join('')}</div></section>`;
}

function funnel(data) {
  const max = Math.max(...data.funnel.map((f) => f.count), 1);
  const rows = data.funnel.map((f, i) => {
    const pct = (f.count / max) * 100;
    // Подпись внутри полосы, пока та достаточно широкая; иначе — сразу за ней.
    const inside = pct > 16;
    return `<div class="fn-row">
      <div class="fn-name">${esc(f.stage)}</div>
      <div class="fn-track">
        <div class="fn-bar" style="width:${f.count ? pct : 0}%;background:${RAMP[i]}"></div>
        <div class="fn-val${f.count ? '' : ' fn-zero'}" style="${
          inside ? `left:0;padding-left:10px;color:#fff` : `left:${pct}%;padding-left:8px`
        }">${f.count}</div>
      </div>
    </div>`;
  }).join('');

  return `<section><h2>Дошли хотя бы до стадии</h2>
    <div class="funnel">${rows}</div></section>`;
}

function table(data, rows, title, caption) {
  if (rows.length === 0) return '';
  const body = rows.map((r) => {
    const empty = r.stage === '—';
    return `<tr class="${empty ? 'is-empty' : ''}${r.stage === 'отклонена' ? ' is-rejected' : ''}">
      <td class="c-day">${r.day === null ? (r.number ? '#' + esc(r.number) : '—') : esc(r.day)}</td>
      <td class="c-slug">${esc(r.slug)}</td>
      <td class="c-stage"><span class="chip"><span class="dot" style="background:${
        stageColor(r.stage)}"></span>${esc(r.stage)}</span></td>
      <td class="c-note">${esc(r.note)}</td>
      <td class="c-wait">${r.waiting ? '▸ ' + esc(r.waiting) : ''}</td>
    </tr>`;
  }).join('');

  return `<section><h2>${esc(title)}</h2><table>
    ${caption ? `<caption>${esc(caption)}</caption>` : ''}
    <colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"></colgroup>
    <thead><tr><th>День</th><th>Слаг</th><th>Стадия</th><th>Цифры</th><th>Ждёт</th></tr></thead>
    <tbody>${body}</tbody></table></section>`;
}

function render(data) {
  const when = data.daysToStart !== null
    ? `старт <b>${data.startDate}</b>, через <b>${data.daysToStart}</b> дн.`
    : `<b>день ${data.dayOfExperiment}</b> из 30`;
  document.getElementById('when').innerHTML = `${data.today} · ${when}`;

  const scheduled = data.rows.filter((r) => r.day !== null).sort((a, b) => a.day - b.day);
  const backlog = data.rows.filter((r) => r.day === null)
    .sort((a, b) => (a.number ?? 0) - (b.number ?? 0));

  document.getElementById('app').innerHTML =
    hero(data) + tiles(data) + funnel(data)
    + table(data, scheduled, 'Расписание', '30 дней с 1 октября')
    + table(data, backlog, 'Вне расписания', 'концепты без назначенного дня');

  // Доска, которая показывает вчерашнее состояние и выглядит свежей, — худший
  // вид поломки. CI это ловит, но экран может висеть на старом деплое.
  const stamp = new Date(data.generatedAt);
  const ageDays = Math.floor((Date.now() - stamp.getTime()) / 86400000);
  const when2 = stamp.toLocaleString('ru-RU', { dateStyle: 'medium', timeStyle: 'short' });
  document.getElementById('stamp').innerHTML = ageDays >= 3
    ? `<span style="color:var(--wait)">Снято ${ageDays} дн. назад (${esc(when2)}) — похоже на устаревший деплой.</span>`
    : 'Снято: ' + esc(when2);
}

let current = null;

async function load() {
  try {
    const res = await fetch('status.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('status.json: ' + res.status);
    const data = await res.json();
    if (data.generatedAt === current) return;
    current = data.generatedAt;
    render(data);
  } catch (err) {
    const box = document.getElementById('error');
    box.hidden = false;
    box.innerHTML = 'Не удалось прочитать <code>status.json</code>: ' + esc(err.message)
      + '<br>Локально страницу надо открывать через сервер, а не файлом: '
      + '<code>python3 -m http.server</code> из папки dashboard/.';
  }
}

load();
// Страница может висеть на экране сутками. Деплой меняет status.json —
// перерисовываемся, когда generatedAt поменялся, и только тогда.
setInterval(load, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
